<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roulette</title>
<style>
  :root{
    --felt:#0d3b2e;
    --felt-dark:#082a20;
    --brass:#c9a45c;
    --brass-bright:#e8c987;
    --bone:#f3ecdd;
    --red:#b3312c;
    --black:#1c1c1c;
    --green-num:#1f7a4d;
    --line:rgba(201,164,92,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Georgia",serif;
    background:radial-gradient(circle at 50% 0%, var(--felt) 0%, var(--felt-dark) 80%);
    color:var(--bone);
    min-height:100vh;
    padding:24px 16px 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  h1{
    font-size:28px;letter-spacing:6px;font-weight:400;
    color:var(--brass-bright);
    text-transform:uppercase;margin-bottom:2px;
  }
  .sub{font-size:13px;color:rgba(243,236,221,.55);font-style:italic;margin-bottom:22px}

  /* ---- Balance ---- */
  .stats{
    display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:20px;
  }
  .stat{
    background:rgba(0,0,0,.22);border:1px solid var(--line);
    border-radius:10px;padding:10px 18px;text-align:center;min-width:110px;
  }
  .stat .label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(243,236,221,.5)}
  .stat .val{font-size:24px;font-weight:700;font-family:"Courier New",monospace;margin-top:3px}
  .val.pos{color:#6fd39a}.val.neg{color:#e78b86}

  /* ---- Wheel ---- */
  .wheel-wrap{position:relative;width:300px;height:300px;margin-bottom:8px}
  canvas{display:block}
  .pointer{
    position:absolute;top:-6px;left:50%;transform:translateX(-50%);
    width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;
    border-top:20px solid var(--brass-bright);filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));z-index:3;
  }
  .result{
    height:40px;margin:6px 0 18px;font-size:22px;letter-spacing:1px;
    display:flex;align-items:center;gap:10px;min-height:40px;
  }
  .result .chip-num{
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-family:"Courier New",monospace;color:#fff;border:2px solid var(--brass);
  }

  /* ---- Controls ---- */
  .panel{
    width:100%;max-width:480px;background:rgba(0,0,0,.2);
    border:1px solid var(--line);border-radius:14px;padding:20px;
  }
  .row{margin-bottom:16px}
  .row-label{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(243,236,221,.55);margin-bottom:8px}

  .bets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .bet-btn{
    padding:12px 6px;border-radius:8px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--bone);font-family:inherit;font-size:14px;
    cursor:pointer;transition:transform .08s, background .15s, border-color .15s;
  }
  .bet-btn:hover{background:rgba(255,255,255,.09)}
  .bet-btn.sel{border-color:var(--brass-bright);background:rgba(201,164,92,.18);color:var(--brass-bright)}
  .bet-btn.red-sw{background:rgba(179,49,44,.35)}
  .bet-btn.red-sw.sel{background:rgba(179,49,44,.6);border-color:#e78b86}
  .bet-btn.blk-sw{background:rgba(0,0,0,.4)}
  .bet-btn.blk-sw.sel{background:rgba(0,0,0,.7);border-color:var(--brass-bright)}

  .num-input{display:flex;gap:8px;align-items:center;margin-top:8px}
  .num-input input{
    width:80px;padding:10px;border-radius:8px;border:1px solid var(--line);
    background:rgba(0,0,0,.3);color:var(--bone);font-family:"Courier New",monospace;font-size:15px;text-align:center;
  }
  .num-input span{font-size:12px;color:rgba(243,236,221,.5)}

  .amount{display:flex;gap:8px;flex-wrap:wrap}
  .amount button{
    flex:1;min-width:60px;padding:10px;border-radius:8px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--bone);font-family:"Courier New",monospace;font-size:14px;cursor:pointer;
  }
  .amount button:hover{background:rgba(255,255,255,.09)}
  .amount button.sel{border-color:var(--brass-bright);background:rgba(201,164,92,.18);color:var(--brass-bright)}

  .spin{
    width:100%;margin-top:6px;padding:16px;border-radius:10px;border:none;cursor:pointer;
    background:linear-gradient(180deg,var(--brass-bright),var(--brass));
    color:#3a2a10;font-family:inherit;font-size:18px;letter-spacing:3px;text-transform:uppercase;font-weight:700;
    transition:filter .15s;
  }
  .spin:hover{filter:brightness(1.08)}
  .spin:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}

  .msg{text-align:center;min-height:22px;margin-top:12px;font-size:15px}
  .msg.win{color:#6fd39a}.msg.lose{color:#e78b86}

  .reset{
    background:none;border:none;color:rgba(243,236,221,.4);font-family:inherit;
    font-size:12px;text-decoration:underline;cursor:pointer;margin-top:18px;
  }
  .history{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px;max-width:480px}
  .history .h{
    width:26px;height:26px;border-radius:50%;font-size:12px;font-family:"Courier New",monospace;
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;
  }
  .tally{
    display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:16px;
    font-family:"Courier New",monospace;font-size:13px;
  }
  .tally span{padding:4px 10px;border-radius:6px;border:1px solid var(--line)}
  .t-red{color:#e78b86}.t-blk{color:rgba(243,236,221,.75)}.t-grn{color:#6fd39a}
</style>
</head>
<body>
  <h1>Roulette</h1>
  <div class="sub">Européenne · un seul zéro · avantage maison 2,7 %</div>

  <div class="stats">
    <div class="stat"><div class="label">Solde</div><div class="val" id="balance">100.00 €</div></div>
    <div class="stat"><div class="label">Net</div><div class="val" id="net">0.00 €</div></div>
    <div class="stat"><div class="label">Tours</div><div class="val" id="spins">0</div></div>
  </div>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="300" height="300"></canvas>
  </div>
  <div class="result" id="result"></div>

  <div class="panel">
    <div class="row">
      <div class="row-label">Ton pari</div>
      <div class="bets" id="bets">
        <button class="bet-btn red-sw" data-bet="red">Rouge <small>×2</small></button>
        <button class="bet-btn blk-sw" data-bet="black">Noir <small>×2</small></button>
        <button class="bet-btn" data-bet="green">Zéro <small>×36</small></button>
        <button class="bet-btn" data-bet="even">Pair <small>×2</small></button>
        <button class="bet-btn" data-bet="odd">Impair <small>×2</small></button>
        <button class="bet-btn" data-bet="number">Numéro <small>×36</small></button>
      </div>
      <div class="num-input" id="numInput" style="display:none">
        <input type="number" id="numVal" min="0" max="36" value="17">
        <span>choisis un numéro de 0 à 36</span>
      </div>
    </div>

    <div class="row">
      <div class="row-label">Mise</div>
      <div class="amount" id="amount">
        <button data-amt="1">1 €</button>
        <button data-amt="5" class="sel">5 €</button>
        <button data-amt="25">25 €</button>
        <button data-amt="100">100 €</button>
      </div>
    </div>

    <button class="spin" id="spinBtn">Lancer</button>
    <div class="msg" id="msg"></div>
  </div>

  <button class="reset" id="reset">Réinitialiser (solde 100 €)</button>
  <div class="history" id="history"></div>

  <div class="tally" id="tally">
    <span class="t-red">Rouge 0 · 0%</span>
    <span class="t-blk">Noir 0 · 0%</span>
    <span class="t-grn">Zéro 0 · 0%</span>
  </div>

<script>
// ---- Données de la roue (ordre réel de la roulette européenne) ----
const ORDER = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const RED = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const colorOf = n => n===0 ? "green" : (RED.has(n) ? "red" : "black");
const hex = {red:"#b3312c", black:"#1c1c1c", green:"#1f7a4d"};

// ---- État ----
let balance = 100, net = 0, spins = 0;
let selBet = null, selAmt = 5, angle = 0, spinning = false;
const history = [];
const tally = {red:0, black:0, green:0};

function drawTally(){
  const tot = tally.red + tally.black + tally.green;
  const pct = x => tot ? (100*x/tot).toFixed(1)+"%" : "0%";
  const el = document.getElementById("tally");
  el.querySelector(".t-red").textContent = `Rouge ${tally.red} · ${pct(tally.red)}`;
  el.querySelector(".t-blk").textContent = `Noir ${tally.black} · ${pct(tally.black)}`;
  el.querySelector(".t-grn").textContent = `Zéro ${tally.green} · ${pct(tally.green)}`;
}

// ---- Canvas ----
const cv = document.getElementById("wheel"), ctx = cv.getContext("2d");
const R = 150, cx = 150, cy = 150, N = ORDER.length, seg = (Math.PI*2)/N;

function draw(){
  ctx.clearRect(0,0,300,300);
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(angle);
  for(let i=0;i<N;i++){
    const n = ORDER[i], a0 = i*seg, a1 = a0+seg;
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.arc(0,0,R,a0,a1); ctx.closePath();
    ctx.fillStyle = hex[colorOf(n)]; ctx.fill();
    ctx.strokeStyle = "rgba(201,164,92,.35)"; ctx.lineWidth = 1; ctx.stroke();
    // numéros
    ctx.save();
    ctx.rotate(a0 + seg/2); ctx.translate(R-18,0); ctx.rotate(Math.PI/2);
    ctx.fillStyle = "#f3ecdd"; ctx.font = "bold 12px Courier New"; ctx.textAlign="center";
    ctx.fillText(n, 0, 0); ctx.restore();
  }
  // moyeu
  ctx.beginPath(); ctx.arc(0,0,34,0,Math.PI*2);
  ctx.fillStyle = "#c9a45c"; ctx.fill();
  ctx.beginPath(); ctx.arc(0,0,26,0,Math.PI*2);
  ctx.fillStyle = "#082a20"; ctx.fill();
  ctx.restore();
  // anneau
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.strokeStyle="#c9a45c"; ctx.lineWidth=5; ctx.stroke();
}
draw();

// ---- Interface ----
function refresh(){
  const b=document.getElementById("balance"), nt=document.getElementById("net");
  b.textContent = balance.toFixed(2)+" €";
  nt.textContent = (net>=0?"+":"")+net.toFixed(2)+" €";
  nt.className = "val "+(net>=0?"pos":"neg");
  document.getElementById("spins").textContent = spins;
}
refresh();

document.querySelectorAll("#bets .bet-btn").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll("#bets .bet-btn").forEach(x=>x.classList.remove("sel"));
    btn.classList.add("sel"); selBet = btn.dataset.bet;
    document.getElementById("numInput").style.display = selBet==="number" ? "flex":"none";
  };
});
document.querySelectorAll("#amount button").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll("#amount button").forEach(x=>x.classList.remove("sel"));
    btn.classList.add("sel"); selAmt = +btn.dataset.amt;
  };
});

// ---- Gains (payout net inclut la mise) : plein numéro/zéro = 36×, chances simples = 2× ----
function isWin(bet, n){
  if(bet==="red")   return colorOf(n)==="red";
  if(bet==="black") return colorOf(n)==="black";
  if(bet==="green") return n===0;
  if(bet==="even")  return n!==0 && n%2===0;
  if(bet==="odd")   return n%2===1;
  if(bet==="number")return n === (+document.getElementById("numVal").value);
  return false;
}
function payout(bet){ return (bet==="number"||bet==="green") ? 36 : 2; }

// ---- Lancer ----
const spinBtn = document.getElementById("spinBtn");
spinBtn.onclick = () => {
  const msg = document.getElementById("msg");
  if(spinning) return;
  if(!selBet){ msg.textContent="Choisis d'abord un pari."; msg.className="msg"; return; }
  if(selAmt > balance){ msg.textContent="Solde insuffisant pour cette mise."; msg.className="msg lose"; return; }

  spinning=true; spinBtn.disabled=true; msg.textContent=""; msg.className="msg";
  balance -= selAmt;

  const win = ORDER[Math.floor(Math.random()*N)];
  const idx = ORDER.indexOf(win);
  // angle cible : amener le centre du secteur sous le pointeur (haut = -PI/2)
  const target = -Math.PI/2 - (idx*seg + seg/2);
  const turns = 5 + Math.floor(Math.random()*3);
  const start = angle, end = target - Math.PI*2*turns;
  const dur = 4200, t0 = performance.now();

  (function anim(now){
    const p = Math.min((now-t0)/dur, 1);
    const e = 1 - Math.pow(1-p, 3);           // easing out cubic
    angle = start + (end-start)*e;
    draw();
    if(p<1){ requestAnimationFrame(anim); }
    else { angle = ((target % (Math.PI*2)) + Math.PI*2) % (Math.PI*2); settle(win); }
  })(t0);
};

function settle(n){
  const msg = document.getElementById("msg");
  spins++;
  const won = isWin(selBet, n);
  let delta = -selAmt;
  if(won){ const gain = selAmt*payout(selBet); balance += gain; delta = gain - selAmt; }
  net += delta;

  // résultat affiché
  const res = document.getElementById("result");
  res.innerHTML = `<span class="chip-num" style="background:${hex[colorOf(n)]}">${n}</span>
                   <span style="color:rgba(243,236,221,.7);font-size:16px">${colorOf(n)==="red"?"Rouge":colorOf(n)==="black"?"Noir":"Zéro"}</span>`;

  if(won){ msg.textContent = `Gagné +${(delta).toFixed(2)} €`; msg.className="msg win"; }
  else   { msg.textContent = `Perdu -${selAmt.toFixed(2)} €`; msg.className="msg lose"; }

  // compteur par couleur
  tally[colorOf(n)]++; drawTally();

  // historique
  history.unshift(n); if(history.length>18) history.pop();
  const h = document.getElementById("history");
  h.innerHTML = history.map(x=>`<div class="h" style="background:${hex[colorOf(x)]}">${x}</div>`).join("");

  refresh();
  spinning=false; spinBtn.disabled=false;
  if(balance < 1){ msg.textContent="Ruine. C'était le sujet de la conversation."; msg.className="msg lose"; }
}

document.getElementById("reset").onclick = () => {
  balance=100; net=0; spins=0; history.length=0;
  tally.red=0; tally.black=0; tally.green=0; drawTally();
  document.getElementById("result").innerHTML="";
  document.getElementById("history").innerHTML="";
  document.getElementById("msg").textContent="";
  refresh();
};
</script>
</body>
</html>
